<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>VELOX — Undeployed</title>
  <style>
    body {
      background-color: #101010;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      text-align: center;
      box-sizing: border-box;
    }
    .box {
      max-width: 480px;
      padding: 2.5rem;
      border: 1px solid #303030;
      border-radius: 12px;
      background-color: #181818;
    }
    h1 {
      color: #C6A875;
      font-size: 1.75rem;
      margin-top: 0;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }
    p {
      color: #A3A3A3;
      font-size: 0.95rem;
      line-height: 1.6;
      margin: 0.5rem 0;
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #C6A875;
      background: rgba(198, 168, 117, 0.12);
      padding: 0.25rem 0.75rem;
      border-radius: 4px;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="box">
    <span class="badge">Status: Offline</span>
    <h1>VELOX Premium Rentals</h1>
    <p>The GitHub Pages deployment has been taken offline.</p>
    <p>The application is now running locally on development environment and preparing for Vercel deployment.</p>
  </div>
</body>
</html>
